# Weekly automated update pull requests (TOOLS-002). They supplement, and
# never replace, the release gate (`check-updates --gate`, run by
# tools/release): Dependabot does not see Python and Go toolchain versions,
# PEP 723 inline script pins (tools/md2html), the pip-audit pin in the
# Makefile, builder-image pins, or vendored assets.
# See docs/development/updates.md.
#
# Every entry turns the cooldown off for all dependencies. Without that,
# Dependabot waits 3 days after a release before proposing it; vakr adopts a
# release however recently it was published (ADR-036). A release that fails
# vakr's tests is held by a recorded exception instead
# (tools/check-updates/update-exceptions.toml).
version: 2
updates:
  # Workflow `uses:` pins. Dependabot also rewrites the "# vX.Y.Z" comment
  # after a commit-SHA pin, which tools/check-updates relies on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: ci

  # pyproject.toml and uv.lock: runtime dependencies and every dependency group.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive together; major versions stay separate
      # because they may need code changes and a changelog entry.
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: deps

  # web/package.json and web/package-lock.json: the web UI's npm packages
  # (ADR-035 #18). Versions stay exact; Node itself is not covered.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # The types follow the Node line the build runs (web/.node-version, 24 LTS),
      # not the newest Node: @types/node 26 describes APIs Node 24 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: deps
