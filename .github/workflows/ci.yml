# Quality gates for every push and pull request (blueprint section 17.8).
# `make check` is the same command developers run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no floating major tag; pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked environment (Python from .python-version)
        run: uv sync --locked
      - name: Format, lint, types, tests, line counts, version source, doc links
        run: make check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Known vulnerabilities in every locked runtime and development dependency
  # (QG-008). Fails on any finding not justified in the ignore list that
  # `make audit` reads.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no floating major tag; pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Scan locked dependencies with pip-audit
        run: make audit
