# Collector-only CAP_NET_RAW fallback for ICMP (ICMP-012, ADR-023).
#
# NOT installed by the package. Use it only on a host where
# net.ipv4.ping_group_range cannot be widened to include the vakr group;
# `vakr doctor` prints that preferred fix. With this drop-in the collector
# opens raw ICMP sockets when unprivileged ping sockets are refused.
#
# Never apply it to vakr-api.service or any other unit: the API, web UI,
# and maintenance processes must not hold a raw-socket capability (15.3).
#
# Install:
#   sudo install -D -m 0644 50-icmp-cap-net-raw.conf \
#       /etc/systemd/system/vakr-collector.service.d/50-icmp-cap-net-raw.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart vakr-collector.service
# Remove: delete the file, then run the same two systemctl commands.
[Service]
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
