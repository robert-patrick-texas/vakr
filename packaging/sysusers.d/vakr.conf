# vakr service account and admin group (PKG-003), applied by postinst with
# `systemd-sysusers vakr.conf`. Services run as vakr, and the vakr group may
# read /etc/vakr and its secrets. On the local API socket, root and members of
# vakr-admin are admins and members of vakr are operators (Appendix E).
#Type Name       ID GECOS                         Home           Shell
u     vakr       -  "vakr network monitor"         /var/lib/vakr  /usr/sbin/nologin
g     vakr-admin -  -                              -              -
