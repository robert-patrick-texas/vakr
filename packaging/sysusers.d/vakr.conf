# vakr service account, admin group, and view group (PKG-003), applied by
# postinst with `systemd-sysusers vakr.conf`. Services run as vakr, and the
# vakr group may read /etc/vakr and its secrets. On the local API socket, root
# and members of vakr-admin are admins, and members of vakr-view and vakr are
# operators (read-only). vakr-view grants no file access, so it is the group to
# give people and monitoring agents that only look (Appendix E.12).
#Type Name       ID GECOS                         Home           Shell
u     vakr       -  "vakr network monitor"         /var/lib/vakr  /usr/sbin/nologin
g     vakr-admin -  -                              -              -
g     vakr-view  -  -                              -              -
