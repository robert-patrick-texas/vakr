# Directories vakr needs (blueprint 11.1, PKG-002, PKG-003), created by postinst
# with `systemd-tmpfiles --create vakr.conf` and again at every boot, which
# recreates /run/vakr on tmpfs. The package itself owns none of them, so dpkg
# never removes or overwrites operator configuration, state, or cache.
# /run/vakr is 0751: other accounts may reach /run/vakr/api.sock by name (but
# not list the directory), so members of vakr-admin and vakr-view who are not
# in vakr can connect; vakr-api then decides every connection's role by SO_PEERCRED
# (Appendix E.12, E.30). The self-update lock in it is mode 0600, owner root.
# /var/lib/vakr/backups takes the vakr-owned backups `vakr db migrate` and
# `vakr db backup` write, and root's pre-update archives. A 0.2.x self-update
# created it as root:root 0700, so the next package's migration, run as vakr,
# could not back up and failed; the owner is set here before postinst migrates.
#Type Path                Mode User Group Age
d     /run/vakr           0751 vakr vakr  -
d     /var/lib/vakr       0750 vakr vakr  -
d     /var/lib/vakr/backups 0700 vakr vakr -
d     /var/cache/vakr     0750 root vakr  -
d     /etc/vakr           0755 root vakr  -
d     /etc/vakr/secrets   0750 root vakr  -
d     /etc/vakr/tls       0755 root root  -
d     /etc/vakr/tls/ca.d  0755 root root  -
