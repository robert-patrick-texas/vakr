# Directories vakr needs (blueprint 11.1, PKG-002, PKG-003), created by postinst
# with `systemd-tmpfiles --create vakr.conf` and again at every boot, which
# recreates /run/vakr on tmpfs. The package itself owns none of them, so dpkg
# never removes or overwrites operator configuration, state, or cache.
#Type Path                Mode User Group Age
d     /run/vakr           0750 vakr vakr  -
d     /var/lib/vakr       0750 vakr vakr  -
d     /var/cache/vakr     0750 root vakr  -
d     /etc/vakr           0755 root vakr  -
d     /etc/vakr/secrets   0750 root vakr  -
d     /etc/vakr/tls       0755 root root  -
d     /etc/vakr/tls/ca.d  0755 root root  -
