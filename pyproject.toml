[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vakr"
dynamic = ["version"]  # read from the root VERSION file only (VER-001)
description = "Network performance and reachability monitor: MRTG/SmokePing successor with SNMP discovery, persistent interface identity, web UI, and TUI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.15"
authors = [{ name = "Robert Patrick" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "argon2-cffi>=25.1.0",   # Argon2id local password hashing with rehash on login (SEC-009, E.12)
    "cryptography>=50.0.2",  # certificate inspection for enterprise CAs (EGRESS-003)
    # JSON API v1 of vakr-api (API-001, API-008). Plain fastapi, not [standard]: that extra
    # adds a CLI, Jinja2, form parsing, and uvicorn[standard], none of which the API uses.
    "fastapi>=0.156.4",
    "pysnmp>=7.1.30",        # asyncio SNMPv2c collection and discovery (SNMP-015, ADR-034)
    "textual>=8.2.8",        # read-only terminal UI, vakr tui (TUI-001, ADR-013)
    "tomlkit>=0.15.2",       # comment-preserving TOML edits for config upgrades (CFGM-002)
    # ASGI server of vakr-api. Plain uvicorn (pure-Python h11), not [standard]: no uvloop,
    # httptools, websockets, or file watcher; behind a local proxy h11 is fast enough (12.9).
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://robert-patrick-texas.github.io/vakr/"
Source = "https://github.com/robert-patrick-texas/vakr"

[project.scripts]
vakr = "vakr.cli.main:main"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "httpx2>=2.15.1",  # transport of the FastAPI/Starlette TestClient in the API tests
    "hypothesis>=6.170.5",
    "pysmi>=2.0.0",  # imported by snmpsim 1.2.2 but not declared by it (ADR-034)
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "snmpsim>=1.2.2",  # SNMP agent simulator for tests (blueprint 23, ADR-034)
    "ty>=0.0.89",
]
# Dependencies of the portable tools under tools/, so ty and pytest can resolve them.
tools = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[tool.uv]
default-groups = ["dev", "tools"]
# Rebuild the editable install when VERSION changes, so `vakr --version` and
# package metadata follow the single version source (VER-001).
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }, { file = "src/**/*.py" }]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/vakr"]

[tool.hatch.build.targets.sdist]
include = ["src/vakr", "tests", "VERSION", "LICENSE", "NOTICE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["_site"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "S", "D", "C90",
    "PLR", "PLE", "PLW", "RUF", "PTH", "PT", "TRY", "BLE", "RET", "ARG",
]
ignore = [
    "TRY003",   # long messages in exceptions are how we give operators actionable errors
    "PLR2004",  # protocol constants (OIDs, port numbers) are clearer inline with a comment
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10  # blueprint section 17.2

[tool.ruff.lint.pylint]
max-statements = 50  # proxy for the 50-line function guideline (section 17.2)
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]
"tools/**/test_*.py" = ["S101", "PLR0913"]

[tool.ty.environment]
python-version = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests", "tools", "packaging/tests"]
# Portable tools import their sibling modules the way their scripts do at runtime.
pythonpath = ["tools/md2html", "tools/check-loc", "tools/check-version", "tools/check-docstrings", "tools/check-updates", "tools/fieldkit", "tools/release", "tools/snmpsim"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "real_icmp_preflight: keep the collector's ICMP startup check even on a host that cannot ping",
]

[tool.coverage.run]
source = ["vakr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Docstring sections required by blueprint sections 17.3-17.4 (QG-003),
# enforced by `make docstrings` (tools/check-docstrings).
[tool.check-docstrings]
module-sections = ["Dependencies", "Example"]
function-sections = ["Args", "Returns", "Raises"]
include-tests = true
exclude = []
