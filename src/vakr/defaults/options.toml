# vakr option catalog: the single source of truth for every configuration
# option (CFGM-001, ADR-027). Validation, the packaged defaults written by
# `vakr config defaults`, docs/operations/configuration.md, and
# `vakr config new-options` are all generated from this file.
#
# Each [[options]] entry has:
#   key          dotted key as operators write it: "update.channel" is
#                `channel` in the [update] table
#   type         str | int | float | bool | duration | enum | list[str] | list[table]
#   default      packaged default; it must pass its own validation
#   since        vakr release that introduced the option (SemVer)
#   reload       live (applied on reload) | restart (needs a service restart)
#   description  operator-facing explanation
# Optional constraints: choices (enum), min and max (int, float, duration in
# seconds), pattern (str regex), format (url | timezone | pattern), and
# required_when = [key, value]. A list[table] option declares its fields as
# [options.fields.<name>] tables and may set merge = "append" (entries from
# every layer are concatenated) with defaults_switch naming a bool option that
# drops the packaged entries when false.
#
# Adding an option: append an entry whose `since` is the release that ships
# it, then regenerate docs/operations/configuration.md with
# `vakr config defaults --markdown`. Renaming, moving, retyping, or removing an
# option also needs a config migration in config-migrations.toml and a
# config_version bump below (CFGM-002).
#
# This file is allowlisted by `make version`: `since` values name releases on
# purpose, like changelog headings (VER-003).

[catalog]
config_version = 1

[[options]]
key = "profile.name"
type = "enum"
choices = ["lite", "compact", "hybrid-small", "standard", "enterprise"]
default = "compact"
since = "0.1.0"
reload = "restart"
description = "Deployment profile, which selects storage backends and sizing guidance. The MVP supports compact: SQLite metadata and telemetry for about 100 devices."

[[options]]
key = "node.role"
type = "enum"
choices = ["primary", "peer"]
default = "primary"
since = "0.1.0"
reload = "restart"
description = "Role of this node. A primary owns inventory and policy metadata; a peer pulls metadata from node.primary_url and keeps collecting while isolated (MPOS-003)."

[[options]]
key = "node.position"
type = "str"
default = ""
since = "0.1.0"
reload = "restart"
description = "Label for this node's network vantage point, shown in the UI, for example east. vakr setup sets it on first install."

[[options]]
key = "node.primary_url"
type = "str"
format = "url"
required_when = ["node.role", "peer"]
default = ""
since = "0.1.0"
reload = "restart"
description = "HTTPS URL of the primary node, for example https://vakr-east.example.net. Required when node.role is peer; ignored on a primary."

[[options]]
key = "time.timezone"
type = "str"
format = "timezone"
default = ""
since = "0.1.0"
reload = "restart"
description = "IANA timezone for displayed times and day boundaries, for example America/New_York. Empty means the host timezone."

[[options]]
key = "update.repository"
type = "str"
pattern = '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
default = "robert-patrick-texas/vakr"
since = "0.1.0"
reload = "live"
description = "GitHub repository (owner/name) that vakr self-update checks for releases (UPD-001)."

[[options]]
key = "update.channel"
type = "enum"
choices = ["stable", "prerelease"]
default = "prerelease"
since = "0.1.0"
reload = "live"
description = "Release channel for self-update. MVP iterations are pre-releases, so prerelease is the default until MVP acceptance."

[[options]]
key = "update.hold_version"
type = "str"
pattern = '^(\d+\.\d+\.\d+(-rc\.\d+)?)?$'
default = ""
since = "0.1.0"
reload = "live"
description = "Pin the deployment to this release; timer-driven updates will not go past it (UPD-008). Empty means no hold."

[[options]]
key = "update.health_settle_seconds"
type = "int"
min = 0
max = 600
default = 30
since = "0.1.1"
reload = "live"
description = "After installing an update, keep re-running the health check for up to this many seconds while it reports CRITICAL, so services that are still starting are not mistaken for a failed update and rolled back (UPD-006). 0 checks once."

[[options]]
key = "network.https_proxy"
type = "str"
format = "url"
default = ""
since = "0.1.0"
reload = "restart"
description = "Proxy for all outbound HTTPS, such as release checks and peer replication (EGRESS-001). Empty falls back to the HTTPS_PROXY environment variable. Never put credentials here; proxy credentials come from the credential provider."

[[options]]
key = "network.no_proxy"
type = "list[str]"
default = []
since = "0.1.0"
reload = "restart"
description = "Hosts and domains that bypass network.https_proxy. Empty falls back to the NO_PROXY environment variable."

[[options]]
key = "network.tls_strict_x509"
type = "bool"
default = true
since = "0.1.0"
reload = "live"
description = "Enforce the strict X.509 profile (OpenSSL VERIFY_X509_STRICT, the Python 3.13+ default) for outbound HTTPS (EGRESS-007). Set to false only when an enterprise TLS-inspection CA, or the certificates its proxy issues, cannot be reissued to meet it. False relaxes only the strict-profile rules, such as a CA's required keyUsage, critical basicConstraints, and key identifiers, lets vakr tls trust-ca install such a CA with a warning, and makes vakr check health report WARNING. It never relaxes certificate verification itself: chain signatures, validity periods, certificate purpose, and host name checks always apply."

[[options]]
key = "telemetry.native_retention_days"
type = "int"
min = 1
default = 30
since = "0.1.0"
reload = "live"
description = "Days to keep full-resolution observations; older data survives only as rollups."

[[options]]
key = "telemetry.rollup_retention_days"
type = "int"
min = 1
default = 400
since = "0.1.0"
reload = "live"
description = "Days to keep rollups, which back long-range graphs."

[[options]]
key = "telemetry.rollup_interval"
type = "duration"
min = 60
default = "15m"
since = "0.1.0"
reload = "restart"
description = "Bucket width of historical rollups."

[[options]]
key = "spool.directory"
type = "str"
pattern = '^(/[^\x00]*)?$'
default = ""
since = "0.2.0"
reload = "restart"
description = "Directory of the durable observation spool (STORE-004). Empty means spool/ under the state directory, normally /var/lib/vakr/spool. Each collector writes its own subdirectory named by its UUID. Use a disk-backed filesystem: paths under /dev/shm and /run are refused because tmpfs can never be the only durability layer (STORE-005)."

[[options]]
key = "spool.max_size_mib"
type = "int"
min = 64
max = 524288
default = 4096
since = "0.2.0"
reload = "restart"
description = "Upper bound on the spool's disk use in MiB, quarantined files included (6.4, E.24). The default holds about 40 hours of the MVP workload while the telemetry database is unavailable. Must be at least four segments."

[[options]]
key = "spool.segment_size_mib"
type = "int"
min = 1
max = 1024
default = 64
since = "0.2.0"
reload = "restart"
description = "Size in MiB at which the spool starts a new segment file (E.8). A segment is deleted only once every record in it is stored in the telemetry database."

[[options]]
key = "spool.fsync_interval"
type = "duration"
min = 0.1
max = 10
default = "1s"
since = "0.2.0"
reload = "restart"
description = "Longest time a completed observation waits for the fsync that makes it durable (group commit, E.8). An abrupt power loss can lose at most about this much telemetry, and recovery records the loss (STORE-007)."

[[options]]
key = "spool.fsync_records"
type = "int"
min = 1
max = 100000
default = 1000
since = "0.2.0"
reload = "restart"
description = "Records written before the spool fsyncs early, even if spool.fsync_interval has not elapsed (E.8)."

[[options]]
key = "spool.queue_capacity"
type = "int"
min = 100
max = 500000
default = 10000
since = "0.2.0"
reload = "restart"
description = "Observations that may wait in memory for the spool's fsync (6.4). When full, collectors wait instead of growing memory, and the wait is reported as queue saturation (QUEUE-T01)."

[[options]]
key = "spool.warning_pct"
type = "int"
min = 1
max = 99
default = 70
since = "0.2.0"
reload = "restart"
description = "Spool fill level, in percent of spool.max_size_mib, at which vakr check health reports WARNING (6.4). Must be below spool.critical_pct."

[[options]]
key = "spool.critical_pct"
type = "int"
min = 1
max = 99
default = 85
since = "0.2.0"
reload = "restart"
description = "Spool fill level at which vakr check health reports CRITICAL capacity degradation (6.4). Must be below spool.exhausted_pct."

[[options]]
key = "spool.exhausted_pct"
type = "int"
min = 1
max = 99
default = 95
since = "0.2.0"
reload = "restart"
description = "Spool fill level at which the collector stops scheduling new normal polling instead of losing observations (6.4). Targets not polled are unknown, never down. The space above it absorbs observations already in flight."

[[options]]
key = "spool.ingest_interval"
type = "duration"
min = 1
max = 300
default = "10s"
since = "0.2.0"
reload = "restart"
description = "How often ingestion writes spooled observations to the telemetry database in one batch (STORE-011, E.21). While at least spool.ingest_max_rows observations wait, batches are written back to back."

[[options]]
key = "spool.ingest_max_rows"
type = "int"
min = 1
max = 50000
default = 50000
since = "0.2.0"
reload = "restart"
description = "Most observations in one telemetry write (STORE-011, E.19). The telemetry backend's own limit applies when it is lower."

[[options]]
key = "interface_classification.use_default_keywords"
type = "bool"
default = true
since = "0.1.0"
reload = "live"
description = "Include the packaged description keywords (ISP, WAN, UPLINK). Set to false to make the operator's keywords replace them instead of extending them (Appendix E.15)."

[[options]]
key = "interface_classification.keywords"
type = "list[table]"
merge = "append"
defaults_switch = "interface_classification.use_default_keywords"
default = [
    { keyword = "ISP", tag = "isp", interest = "primary", wan_circuit = true },
    { keyword = "WAN", tag = "wan", interest = "primary", wan_circuit = true },
    { keyword = "UPLINK", tag = "uplink", interest = "primary", wan_circuit = false },
]
since = "0.1.0"
reload = "live"
description = "Interface description (ifAlias) keywords that classify interfaces (META-012). Matching is case-insensitive on whole tokens. Entries from every operator file extend the packaged list."

[options.fields.keyword]
type = "str"
format = "pattern"
required = true
description = "One word of letters and digits, matched case-insensitively against whole description tokens; prefix exact: to match case, or re: for a bounded regular expression that must match one whole token (POLICY-005)."

[options.fields.tag]
type = "str"
required = true
description = "Tag applied to interfaces whose description contains the keyword."

[options.fields.interest]
type = "enum"
choices = ["primary", "secondary"]
description = "Interest class to assign (META-011). Omit it to leave interest to annotations and policy rules."

[options.fields.wan_circuit]
type = "bool"
default = false
description = "Mark matching interfaces as WAN circuits."

[options.fields.sticky]
type = "bool"
default = false
description = "Pin matching interfaces to the top of the device's interface list."

# Scheduler and polling defaults (milestone M3, blueprint 8.11 and Appendix E.25).
# A device's own interval and strategy take precedence over the [polling] defaults.

[[options]]
key = "polling.default_interval"
type = "duration"
min = 30
max = 3600
default = "60s"
since = "0.2.0"
reload = "live"
description = "Poll interval for devices without their own interval (SCHED-010). Each poll is anchored to its intended slot, not to when the previous poll finished. The range matches the policy limits of Appendix E.18."

[[options]]
key = "polling.reachability_strategy"
type = "enum"
choices = ["icmp_gated", "snmp_fallback", "icmp_only", "snmp_only"]
default = "icmp_gated"
since = "0.2.0"
reload = "live"
description = "How ICMP gates SNMP for devices without their own strategy (ICMP-006 to ICMP-014). icmp_gated skips SNMP after 0 or 1 of 5 replies; snmp_fallback then makes one low-cost Stage 1 attempt; icmp_only never uses SNMP; snmp_only never pings."

[[options]]
key = "scheduler.collector_name"
type = "str"
pattern = '^([A-Za-z0-9][A-Za-z0-9._-]{0,62})?$'
default = ""
since = "0.2.0"
reload = "restart"
description = "Name of this collector; the hostname phase is hashed from it (SCHED-001, Appendix E.11). Empty means the host's short name, lower-cased, without its DNS suffix. Changing it moves every device's poll time."

[[options]]
key = "scheduler.phase"
type = "enum"
choices = ["hostname", "fixed"]
default = "hostname"
since = "0.2.0"
reload = "restart"
description = "Where this collector's polling cycle starts within each interval (SCHED-002 to SCHED-004). hostname derives it from scheduler.collector_name, so two collectors watching the same devices do not probe them at the same instant; fixed uses scheduler.fixed_phase."

[[options]]
key = "scheduler.fixed_phase"
type = "duration"
min = 0
max = 3600
default = "0s"
since = "0.2.0"
reload = "restart"
description = "Cycle start offset when scheduler.phase is fixed (SCHED-004), taken modulo each device's interval."

[[options]]
key = "scheduler.device_order"
type = "enum"
choices = ["common", "hashed"]
default = "common"
since = "0.2.0"
reload = "restart"
description = "How devices are placed after the phase (SCHED-005, SCHED-006). common hashes the device UUID, so every collector visits devices in the same relative order; hashed also hashes the collector name, giving each collector its own order. Hashing spreads polls across the interval; it does not guarantee that two devices never start together (SCHED-007)."

[[options]]
key = "scheduler.workers"
type = "int"
min = 1
max = 1000
default = 32
since = "0.2.0"
reload = "restart"
description = "Polls that may run at once (SCHED-016). The MVP workload needs about 5 on average. When every worker is busy, a due poll waits up to scheduler.max_start_delay and is then recorded as not attempted, which shows as unknown, never as a device outage (SCHED-017)."

[[options]]
key = "scheduler.queue_capacity"
type = "int"
min = 16
max = 100000
default = 1000
since = "0.2.0"
reload = "restart"
description = "Finished poll records held between the scheduler and the spool (section 6.4), about 10 minutes of polls at the MVP workload. When it is full, polling slows and the collector reports itself overloaded; records are never dropped."

[[options]]
key = "scheduler.late_after"
type = "duration"
min = 1
max = 300
default = "5s"
since = "0.2.0"
reload = "restart"
description = "A poll that starts more than this after its slot counts as late in health metrics (section 4.2 asks for 99% within about 5s). Must not exceed scheduler.max_start_delay."

[[options]]
key = "scheduler.max_start_delay"
type = "duration"
min = 1
max = 600
default = "30s"
since = "0.2.0"
reload = "restart"
description = "A due poll that cannot start within this time, because every worker is busy or the collector stalled, is recorded as not attempted instead of running late (SCHED-017). A device still being polled at its next slot gets that slot recorded as missed (overrun) at once (SCHED-012)."

[[options]]
key = "scheduler.poll_deadline"
type = "duration"
min = 5
max = 3600
default = "90s"
since = "0.2.0"
reload = "restart"
description = "A poll still running after this long is stopped. Steps that already finished keep their results, and the poll is recorded as partial or failed. At the 60s default interval a hung poll costs at most one missed slot."

[[options]]
key = "scheduler.shutdown_grace"
type = "duration"
min = 0
max = 300
default = "15s"
since = "0.2.0"
reload = "restart"
description = "On shutdown, how long running polls get to finish before they are cancelled; every cancelled poll is still recorded, with the results of its finished steps (section 16.4). Keep it well below the service's systemd stop timeout."

[[options]]
key = "icmp.probes"
type = "int"
min = 2
max = 5
default = 5
since = "0.2.0"
reload = "live"
description = "ICMP Echo probes sent to each device per reachability cycle (ICMP-001). At least 2: under the default icmp_gated strategy SNMP runs only after two replies, and a single probe can never show a device as reachable (Appendix E.17). At most 5, the per-probe RTT columns of Compact storage (ADR-021)."

[[options]]
key = "icmp.spacing"
type = "duration"
min = 0.02
max = 5
default = "200ms"
since = "0.2.0"
reload = "live"
description = "Time between the starts of consecutive probes to one device (ICMP-002). Probes go out on a fixed schedule from the start of the cycle, so a late probe does not delay the next one."

[[options]]
key = "icmp.timeout"
type = "duration"
min = 0.1
max = 5
default = "1s"
since = "0.2.0"
reload = "live"
description = "How long to wait for each probe's reply before counting that probe as lost (Appendix E.9). With the defaults a cycle finishes within about 2 seconds."

[[options]]
key = "icmp.impaired_loss_percent"
type = "float"
min = 1
max = 100
default = 40.0
since = "0.2.0"
reload = "live"
description = "Packet loss, in percent of the probes sent, at or above which a device that still answers is shown as impaired instead of reachable (Appendix E.1). The default 40 tolerates one lost probe in five, which Control Plane Policing causes routinely."

[[options]]
key = "icmp.impaired_rtt_ms"
type = "float"
min = 0
max = 5000
default = 0.0
since = "0.2.0"
reload = "live"
description = "Median round-trip time, in milliseconds, above which a device is shown as impaired (Appendix E.1). 0, the default, turns the latency check off."

[[options]]
key = "icmp.max_in_flight"
type = "int"
min = 16
max = 16384
default = 1024
since = "0.2.0"
reload = "restart"
description = "Most ICMP probes the collector waits on at once, across all devices (Appendix E.22). A probe that cannot be sent in time is recorded as collector overload, never as packet loss. 1,024 is about twice what 100 unreachable devices need."

# SNMP collection and discovery (SNMP-011, SNMP-016, SNMP-017, DISC-002, DISC-009;
# Appendix E.4, E.9, E.18, E.23). Communities never go here: they live in
# /etc/vakr/secrets/credentials.toml and devices name them by reference.
# since: set to the release that ships these when VERSION is bumped (it may
# not name a release newer than VERSION, so it reads 0.1.1 until then).

[[options]]
key = "snmp.port"
type = "int"
min = 1
max = 65535
default = 161
since = "0.2.0"
reload = "live"
description = "UDP port of SNMP agents (SNMP-016)."

[[options]]
key = "snmp.timeout"
type = "duration"
min = 1
max = 30
default = "2s"
since = "0.2.0"
reload = "live"
description = "How long to wait for each SNMP answer before the attempt counts as unanswered (SNMP-011, Appendix E.9)."

[[options]]
key = "snmp.retries"
type = "int"
min = 0
max = 5
default = 1
since = "0.2.0"
reload = "live"
description = "Complete new attempts after an unanswered SNMP request. Each retry is counted and flagged in the poll's quality (SNMP-018)."

[[options]]
key = "snmp.max_varbinds"
type = "int"
min = 5
max = 100
default = 30
since = "0.2.0"
reload = "live"
description = "Varbinds per SNMP request at the start of each session. After a tooBig answer vakr halves it, down to 5, for the rest of the session (SNMP-017, Appendix E.4)."

[[options]]
key = "snmp.max_repetitions"
type = "int"
min = 1
max = 100
default = 25
since = "0.2.0"
reload = "live"
description = "GETBULK max-repetitions for discovery walks (Appendix E.9). It never exceeds snmp.max_varbinds."

[[options]]
key = "snmp.max_walk_rows"
type = "int"
min = 100
max = 100000
default = 10000
since = "0.2.0"
reload = "live"
description = "Most rows one discovery walk of a table column may return. A walk that reaches it stops, keeps the rows it has, and marks the table partial (Appendix E.23)."

[[options]]
key = "snmp.rediscovery_interval"
type = "duration"
min = 30
max = 2592000
default = "24h"
since = "0.2.0"
reload = "live"
description = "How often each device is rediscovered (DISC-002). Policy rules and devices can override it within 30s to 30d (Appendix E.18)."

[[options]]
key = "snmp.capability_reprobe_interval"
type = "duration"
min = 3600
max = 7776000
default = "7d"
since = "0.2.0"
reload = "live"
description = "How long vakr trusts a learned counter limitation, such as an interface without 64-bit counters, before asking for the missing counters again (DISC-009, Appendix E.9)."

# Status CLI and TUI (milestone M3, blueprint 13 and Appendix E.29). vakr status and
# vakr tui read the local databases through the query services; they never write.

[[options]]
key = "tui.refresh_interval"
type = "duration"
min = 2
max = 600
default = "10s"
since = "0.2.0"
reload = "restart"
description = "How often vakr tui reads current state again (13.1, Appendix E.29). vakr tui --refresh overrides it. At the 60s default poll interval, 10s shows a new poll within a few seconds and keeps database reads trivial."

# Inventory file and network target guardrails (milestone M3: blueprint 11.1-11.4, 15.5,
# Appendix E.26). The inventory itself lives in inventory.toml, not here.

[[options]]
key = "inventory.file"
type = "str"
pattern = '^(/[^\x00]*)?$'
default = ""
since = "0.2.0"
reload = "live"
description = "File holding file-managed devices, sites, and interface annotations (META-008, META-010). Empty means inventory.toml in the configuration directory, normally /etc/vakr/inventory.toml. Apply changes with vakr inventory plan and vakr inventory apply."

[[options]]
key = "security.allowed_target_cidrs"
type = "list[str]"
default = []
since = "0.2.0"
reload = "live"
description = "Networks, in CIDR form, that every poll target must fall in (15.5, SEC-015). Empty allows any unicast address. Multicast, unspecified, and broadcast addresses are always refused."

[[options]]
key = "security.denied_target_addresses"
type = "list[str]"
default = ["169.254.169.254/32", "fd00:ec2::254/128", "100.100.100.200/32"]
since = "0.2.0"
reload = "live"
description = "Addresses or CIDR networks that are never polled (15.5, SEC-015). The defaults are the cloud metadata services, which answer anyone on the host. Setting this list replaces the defaults."

# Local authentication for the web UI and API (milestone M4: SEC-009..012, Appendix E.12).
# Accounts are managed with vakr setup and vakr user; these keys tune sessions and throttling.

[[options]]
key = "auth.session_idle_timeout"
type = "duration"
min = 300
max = 86400
default = "30m"
since = "0.2.1"
reload = "restart"
description = "A signed-in session ends after this long without a request (SEC-010, Appendix E.12). Must not exceed auth.session_lifetime. Use is recorded at most once a minute, so a session can end up to a minute earlier, never later."

[[options]]
key = "auth.session_lifetime"
type = "duration"
min = 600
max = 604800
default = "12h"
since = "0.2.1"
reload = "restart"
description = "A signed-in session ends this long after login however active it is, and the user signs in again (absolute expiry, SEC-010, Appendix E.12)."

[[options]]
key = "auth.kiosk_token_lifetime"
type = "duration"
min = 86400
max = 31536000
default = "30d"
since = "0.2.1"
reload = "restart"
description = "How long a kiosk token for an unattended display stays valid after an admin creates it (Appendix E.12). Kiosk tokens have the operator role and no idle expiry."

[[options]]
key = "auth.login_throttle_after"
type = "int"
min = 1
max = 100
default = 5
since = "0.2.1"
reload = "restart"
description = "From this many consecutive failed logins for one account from one address, each failure is answered after a delay and the next attempt must wait as long: 1 s, doubling with each further failure, up to auth.login_throttle_max_delay (SEC-012, Appendix E.12). A successful login clears the count."

[[options]]
key = "auth.login_throttle_max_delay"
type = "duration"
min = 1
max = 300
default = "30s"
since = "0.2.1"
reload = "restart"
description = "Longest delay before the next login attempt for one account from one address (SEC-012, Appendix E.12)."

[[options]]
key = "auth.login_failure_reset"
type = "duration"
min = 60
max = 86400
default = "15m"
since = "0.2.1"
reload = "restart"
description = "A run of failed logins with no new failure for this long is forgotten, and the next failure counts from one again (SEC-012, Appendix E.12)."

[[options]]
key = "auth.password_min_length"
type = "int"
min = 8
max = 128
default = 15
since = "0.2.1"
reload = "restart"
description = "Fewest characters a new password may have (NIST SP 800-63B for a single-factor password, Appendix E.12). Existing passwords keep working; the rule applies when one is set."

# Rate derivation in the collector (RATE-003, RATE-009; Appendix E.4, E.27).
# E.17 defers these keys to the M3 collector, which uses them.

[[options]]
key = "rates.max_gap_intervals"
type = "float"
min = 2
max = 20
default = 5.0
since = "0.2.0"
reload = "live"
description = "Longest gap between two counter samples, in effective polling intervals, across which a rate is still derived (Appendix E.4). A longer gap leaves the rate unavailable with BASELINE_GAP instead of averaging over the outage (RATE-003). 32-bit counters are further limited to half their wrap time at line rate."

[[options]]
key = "rates.plausibility_factor"
type = "float"
min = 1
max = 10
default = 1.1
since = "0.2.0"
reload = "live"
description = "A derived rate above this multiple of the interface's effective capacity is kept and flagged RATE_EXCEEDS_CAPACITY, never clipped (RATE-009, Appendix E.4)."
