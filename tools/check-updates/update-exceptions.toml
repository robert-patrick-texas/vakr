# Dependencies held on their last-known-good version because their newest
# release failed vakr's tests (TOOLS-004, ADR-036). This is the only accepted
# reason to stay behind: a release's age never is.
#
# One [[exception]] per held item:
#   item      the ITEM column of `make updates`, exactly as printed
#   version   the newest release that failed; when a newer one is published,
#             the row turns "update available" again and must be retested
#   reason    what failed: the test, command, or error, short enough to read
#   recorded  the date of the failed test
#
# The CURRENT column of `make updates` is the last-known-good version. Keep
# it there: a held PyPI package also needs a `NAME<VERSION` entry in
# [tool.uv] constraint-dependencies, so `uv lock --upgrade` leaves it alone.
# Name each held item under "### Additional Notes" in the release's CHANGELOG
# section, with what failed; the release preflight checks it (VER-005).
# docs/development/updates.md has the whole procedure.

# Microsoft's 7.0 announcement: "Projects using Vue, MDX, Astro, Svelte, and
# others will need to continue using TypeScript 6.0 for now"; 7.1 is to ship a
# new, different API. typescript-eslint tracks TS >= 7.1 support in
# https://github.com/typescript-eslint/typescript-eslint/issues/10940. So
# revisit when TypeScript publishes and also when SvelteKit or typescript-eslint
# support the 7.x API. The @typescript/typescript6 alias passes, but every tool
# would still run 6.0.3 (7.0.2 only re-checks the .ts files, not the .svelte
# ones), and check-updates cannot read npm aliases, so it is not used.
# Retested 2026-11-14 with typescript-eslint 8.72.2, which still refuses TS 7.0;
# openapi-typescript 7.13.0 (check:api) now fails too.
# Retested 2026-11-26 with typescript-eslint 8.74.0 (still refuses TS 7.0) and
# SvelteKit 3.4.1, which now stops with typescript_compiler_api_missing and
# asks for typescript@^6; openapi-typescript 7.13.0 still crashes.
[[exception]]
item = "typescript"
version = "7.0.2"
reason = "TS 7.0 has no JavaScript API until 7.1: typescript-eslint 8.74.0 refuses it (lint), SvelteKit 3.4.1 stops with typescript_compiler_api_missing (svelte-check, vitest, build), and openapi-typescript 7.13.0 crashes (check:api); 6.0.3 passes all"
recorded = 2026-11-26
