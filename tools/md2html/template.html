<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>${title}</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --surface: #f6f8fa;
  --link: #0969da;
  --current: #ddf4ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --border: #3d444d;
    --surface: #151b23;
    --link: #4493f8;
    --current: #13233a;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--link); }
.bar, .layout { max-width: 74rem; margin: 0 auto; padding-inline: 1rem; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.25rem; padding-block: .6rem; }
.topbar .site { color: var(--fg); font-weight: 600; text-decoration: none; margin-right: auto; }
.topbar .links { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem 1.25rem; }
.topbar .repo { display: inline-flex; align-items: center; gap: .35rem; }
.icon { flex: none; }
/* Phone-width index toggle: a checkbox and its label, so it works without JavaScript. */
.nav-toggle { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.nav-label {
  display: inline-flex; align-items: center; gap: .4rem; padding: .15rem .6rem; cursor: pointer;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); user-select: none;
}
.nav-toggle:focus-visible ~ .topbar .nav-label { outline: 2px solid var(--link); outline-offset: 2px; }
.nav-toggle:checked ~ .topbar .nav-label { background: var(--current); border-color: var(--link); }
.sidebar {
  display: none; padding-block: .75rem; border-bottom: 1px solid var(--border);
  font-size: .9rem; line-height: 1.4; overflow-wrap: anywhere;
}
.nav-toggle:checked ~ .layout .sidebar { display: block; }
.sidebar ul { list-style: none; margin: 0; padding: 0; }
.sidebar ul ul { margin-left: .75rem; padding-left: .25rem; border-left: 1px solid var(--border); }
.sidebar a, .sidebar summary { padding: .25rem .5rem; border-radius: 6px; }
.sidebar a { display: block; color: var(--fg); text-decoration: none; }
.sidebar a:hover { background: var(--surface); text-decoration: underline; }
.sidebar summary { cursor: pointer; color: var(--muted); font-weight: 600; }
.sidebar summary:hover { color: var(--fg); }
.sidebar a[aria-current="page"] {
  background: var(--current); color: var(--link); font-weight: 600; box-shadow: inset 3px 0 0 var(--link);
}
.content { min-width: 0; }
@media (min-width: 60rem) {
  .layout { display: grid; grid-template-columns: 16rem minmax(0, 52rem); column-gap: 2.5rem; }
  .sidebar {
    display: block; position: sticky; top: 0; align-self: start; max-height: 100vh;
    overflow-y: auto; padding: 1rem .25rem 2rem 0; border-bottom: 0;
  }
  .nav-toggle, .nav-label { display: none; }
}
@media print { .sidebar, .nav-label { display: none !important; } }
main { padding-block: .5rem 2.5rem; overflow-wrap: break-word; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.75em 0 .6em; }
h1, h2 { padding-bottom: .3em; border-bottom: 1px solid var(--border); }
main > h1:first-child { margin-top: 1rem; }
.header-anchor { margin-left: .2em; color: var(--muted); text-decoration: none; opacity: 0; }
:is(h1, h2, h3, h4, h5, h6):hover .header-anchor, .header-anchor:focus { opacity: 1; }
@media (hover: none) { .header-anchor { opacity: .4; } }
code, kbd, pre, samp {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: .875em;
}
:not(pre) > code { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: .1em .3em; }
pre {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: .75rem 1rem; overflow-x: auto; line-height: 1.45; tab-size: 4;
}
pre code { font-size: 1em; }
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table { border-collapse: collapse; overflow-wrap: normal; }
th, td { border: 1px solid var(--border); padding: .4rem .75rem; text-align: left; vertical-align: top; }
th { font-weight: 600; }
blockquote { margin: 1rem 0; padding: 0 1rem; color: var(--muted); border-left: .25em solid var(--border); }
img { max-width: 100%; height: auto; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
.contains-task-list { list-style: none; padding-left: 1.5em; }
.task-list-item-checkbox { margin: 0 .4em 0 -1.4em; vertical-align: middle; }
.footnotes { color: var(--muted); font-size: .9em; }
footer { color: var(--muted); font-size: .875rem; padding-block: 1rem 2rem; border-top: 1px solid var(--border); }
footer a { color: inherit; }
</style>
</head>
<body>
<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-controls="sidebar">
<header class="topbar">
<div class="bar">
<label class="nav-label" for="nav-toggle"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2 3.5h12M2 8h12M2 12.5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Pages</label>
<a class="site" href="${home}">${site}</a>
<nav class="links" aria-label="Site"><a href="${home}">Home</a> <a href="${all_docs}">All docs</a>${repo}</nav>
</div>
</header>
<div class="layout">
${nav}<div class="content">
<main>
${body}</main>
<footer>${footer}</footer>
</div>
</div>
</body>
</html>
