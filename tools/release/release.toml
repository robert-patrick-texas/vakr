# Configuration for tools/release (blueprint section 28.7). Every value that is
# specific to vakr lives here, so another project reuses the tool by editing
# this file only (section 29). Relative paths are relative to the repository
# root, which is the directory the tool runs from.

# GitHub repository (OWNER/NAME) that receives tags and releases.
repo = "robert-patrick-texas/vakr"
# Package name, used in artifact patterns as {package}.
package = "vakr"
version_file = "VERSION"
# Release notes come from this file's "## <version>" section.
changelog = "CHANGELOG.md"
# Releases are cut only from this branch, after CI is green for its HEAD.
branch = "main"
remote = "origin"

# Release trust (ADR-026). The private key stays on the development host and is
# passphrase-protected; it is never stored in GitHub. "~" means the home of the
# user running the tool.
signing_key = "~/.config/vakr-release/release_ed25519"
# ssh-keygen -Y sign/verify namespace, and the principal in allowed_signers.
namespace = "vakr-release"
identity = "vakr-release"
# The trusted signers file that the package ships as
# /opt/vakr/share/release-signers; signatures are checked against it before
# anything is published.
allowed_signers = "packaging/release-signers"

# Builds the artifacts in a clean container. Runs with VERSION_OVERRIDE removed.
build_command = ["make", "deb"]
# Artifacts to checksum, sign, and attach. Placeholders: {package}, {version}
# (as in VERSION), {pep440}, {deb_version}, {tag}. Each required pattern must
# match at least one file; optional ones may match nothing.
artifacts = ["dist/{package}_{deb_version}_amd64.deb"]
optional_artifacts = ["dist/{package}-fieldkit.pyz"]
# Where SHA256SUMS, SHA256SUMS.sig, the notes, and copies of the artifacts go.
output_dir = "dist/release/{tag}"

# GitHub pre-release marking: "rc-or-major-zero" (the MVP rule: every -rc and
# every 0.x release), "rc", "always", or "never".
prerelease = "rc-or-major-zero"
