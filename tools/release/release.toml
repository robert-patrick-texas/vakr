# Configuration for tools/release (blueprint section 28.7). Every value that is
# specific to vakr lives here, so another project reuses the tool by editing
# this file only (section 29). Relative paths are relative to the repository
# root, which is the directory the tool runs from.

# GitHub repository (OWNER/NAME) that receives tags and releases.
repo = "robert-patrick-texas/vakr"
# Package name, used in artifact patterns as {package}.
package = "vakr"
version_file = "VERSION"
# Release notes come from this file's "## <version>" section.
changelog = "CHANGELOG.md"
# Releases are cut only from this branch, after CI is green for its HEAD.
branch = "main"
remote = "origin"

# Release trust (ADR-026). The private key stays on the development host and is
# passphrase-protected; it is never stored in GitHub. "~" means the home of the
# user running the tool.
signing_key = "~/.config/vakr-release/release_ed25519"
# ssh-keygen -Y sign/verify namespace, and the principal in allowed_signers.
namespace = "vakr-release"
identity = "vakr-release"
# The trusted signers file that the package ships as
# /opt/vakr/share/release-signers; signatures are checked against it before
# anything is published.
allowed_signers = "packaging/release-signers"

# Builds the artifacts in a clean container. Runs with VERSION_OVERRIDE removed.
build_command = ["make", "deb"]
# Programs the release host must have; preflight runs `<tool> --version` for
# each. The web UI is built and checked with Node and npm (ADR-035); cloc
# counts the lines of code for the release notes (VER-006).
build_tools = ["node", "npm", "cloc"]
# The installed node must be on the line this file pins (major only, e.g. 24).
# Empty or absent skips the check.
node_version_file = "web/.node-version"
# Check runs that never block a release, by exact name. GitHub runs Dependabot's
# update jobs on a commit that changes .github/dependabot.yml; they test nothing
# being released and can fail for reasons outside the project (Dependabot does
# not resolve Python 3.15). Absent or empty: every check run counts.
ci_ignore_checks = ["Dependabot"]
# Run when the release starts, not only while it is prepared: vakr ships on the
# newest release of every dependency, however recently it was published, unless
# that release failed vakr's tests and is held by a recorded exception
# (ADR-036, TOOLS-005). Must exit 0. Absent or empty: no check.
update_check = ["uv", "run", "tools/check-updates/check_updates.py", "--gate"]
# Artifacts to checksum, sign, and attach. Placeholders: {package}, {version}
# (as in VERSION), {pep440}, {deb_version}, {tag}. Each required pattern must
# match at least one file; optional ones may match nothing.
artifacts = ["dist/{package}_{deb_version}_amd64.deb"]
optional_artifacts = ["dist/{package}-fieldkit.pyz"]
# Where SHA256SUMS, SHA256SUMS.sig, the notes, and copies of the artifacts go.
output_dir = "dist/release/{tag}"

# GitHub pre-release marking: "rc-or-major-zero" (every -rc and every 0.x
# release), "rc", "always", or "never". No vakr release is marked pre-release
# unless the owner asks for it: every packaged version must download as a
# normal release, and GitHub's latest links skip pre-releases (owner, 2026-10-28).
prerelease = "never"

# Release notes (owner, 2026-11-14). The changelog section opens with a summary
# of one to three sentences, then these topics in this order, skipping any with
# nothing in it: a release with one bug fix shows only Fixed (VER-005). Every
# dependency held back after a failed test is named under Additional Notes
# (TOOLS-004). The tool then appends a lines-of-code table (VER-006) and a
# versions table (VER-007) to what it publishes.
[notes]
sections = ["New", "Changed", "Fixed", "Additional Notes"]
summary_sentences = 3
held_file = "tools/check-updates/update-exceptions.toml"
held_section = "Additional Notes"
# cloc counts the files git tracks, which are all first-party: nothing is
# vendored. Generated files are left out, so the count is code people wrote:
# the lockfiles and hash pins that record third-party packages, the OpenAPI
# document `make openapi` writes, and the ADR-021 benchmark digests.
loc_command = ["cloc"]
loc_exclude = [
    "uv.lock",
    "web/package-lock.json",
    "packaging/build-constraints.txt",
    "docs/api/openapi.json",
    "docs/performance/*.json",
]

# Rows of the versions table, in order. The previous release's published
# table supplies the old column, so a row's name must not change. Each row reads
# one source: `file` + `regex` (a pin in the repository), `lock` + `package`
# (uv.lock or a package-lock.json), or `deb` + `member` + `regex` (a file
# inside the built package). The regex's first group is the version.

# Runtime: what the package ships.
[[notes.versions]]
name = "Python (bundled CPython)"
deb = "dist/{package}_{deb_version}_amd64.deb"
member = "./opt/vakr/python/lib/python3.*/_sysconfig_vars_*.json"
regex = '"py_version": "([^"]+)"'

[[notes.versions]]
name = "python-build-standalone"
deb = "dist/{package}_{deb_version}_amd64.deb"
member = "./opt/vakr/python/BUILD"
regex = '(\d{8})'

[[notes.versions]]
name = "FastAPI"
lock = "uv.lock"
package = "fastapi"

