# Build: the toolchain that produces the package.
[[notes.versions]]
name = "Node.js (web build)"
file = "web/.node-version"
regex = '^(\S+)'

[[notes.versions]]
name = "Vite"
lock = "web/package-lock.json"
package = "vite"

[[notes.versions]]
name = "TypeScript"
lock = "web/package-lock.json"
package = "typescript"

[[notes.versions]]
name = "uv (package builder)"
file = "packaging/Dockerfile"
regex = 'astral-sh/uv:(\d+\.\d+\.\d+)@'

[[notes.versions]]
name = "Go (builds nfpm)"
file = "packaging/Dockerfile"
regex = 'FROM golang:(\d+\.\d+\.\d+)@'

[[notes.versions]]
name = "nfpm"
file = "packaging/Dockerfile"
regex = 'nfpm/v2/cmd/nfpm@v(\S+)'

